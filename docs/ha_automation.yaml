alias: CabinControl Price Limit Enforcement
description: Ensure minimum temperature even when electricity is expensive.
trigger:
  - platform: time_pattern
    minutes: "/15"
condition:
  - condition: state
    entity_id: input_boolean.price_limit_enabled
    state: "on"
action:
  - variables:
      max_price: "{{ states('input_number.max_price') | float(0) }}"
      min_temp: "{{ states('input_number.min_temp') | float(0) }}"
      current_price: >-
        {% set price = states('sensor.tibber_price') | float(0) %}
        {% set unit = state_attr('sensor.tibber_price', 'unit_of_measurement') | lower %}
        {% if 'öre' in unit or 'øre' in unit or 'ore' in unit %}
          {{ price / 100 }}
        {% else %}
          {{ price }}
        {% endif %}
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ state_attr('climate.livingroom','current_temperature') | float(0) < min_temp }}"
        sequence:
          - service: climate.set_hvac_mode
            target:
              entity_id: climate.livingroom
            data:
              hvac_mode: heat
      - conditions:
          - condition: template
            value_template: "{{ current_price > max_price }}"
        sequence:
          - service: climate.set_hvac_mode
            target:
              entity_id: climate.livingroom
            data:
              hvac_mode: off
    default:
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.livingroom
        data:
          hvac_mode: heat
  - repeat:
      count: 1
      sequence:
        - service: climate.set_hvac_mode
          target:
            entity_id:
              - climate.bedroom1
              - climate.bedroom2
          data:
            hvac_mode: >-
              {% if state_attr('climate.bedroom1','current_temperature') | float(0) < min_temp %}
              heat
              {% elif current_price > max_price %}
              off
              {% else %}
              heat
              {% endif %}
mode: single
